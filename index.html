<!DOCTYPE html>

        <div class="donate-section">

            </a>

        <i class="fas fa-arrow-left back-button" onclick="toggleContainers()" aria-label="Back"></i>

            <a href="#" class = "donate-link usdt" onclick="copyUSDTAddress()">
                <img src="usdt.jpg" style="width: 70px; height: auto;">

            </a>
